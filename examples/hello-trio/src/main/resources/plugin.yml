name: HelloTrio
version: ${project.version}
main: net.fliver.trio.example.HelloTrioPlugin
api-version: '1.20'
description: Minimal Paper plugin that demonstrates Trio.
authors: [Fliver]
commands:
  hello:
    description: Say hello via Trio.
    usage: /hello [reload|http|menu]
    permission: hellotrio.use
permissions:
  hellotrio.use:
    default: true
  hellotrio.reload:
    default: op
  hellotrio.http:
    default: op
  hellotrio.menu:
    default: true
  hellotrio.admin:
    default: op
